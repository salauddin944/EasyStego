<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; font-weight: 400; fill: #444; }
    .embed-box { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .extract-box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .shared-box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .arr-line { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="680" height="860" fill="white"/>

<!-- Column headers -->
<rect x="40" y="20" width="270" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="175" y="40" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Embedding process</text>
<rect x="370" y="20" width="270" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="505" y="40" text-anchor="middle" dominant-baseline="central" fill="#085041">Extraction process</text>

<!-- Divider -->
<line x1="340" y1="70" x2="340" y2="600" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- EMBED steps -->
<rect x="60" y="90" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="112" text-anchor="middle" dominant-baseline="central" fill="#0C447C">1. Input image</text>
<text class="ts" x="175" y="132" text-anchor="middle" dominant-baseline="central">Drag and drop PNG / JPEG</text>
<line x1="175" y1="146" x2="175" y2="176" class="arr-line"/>

<rect x="60" y="176" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="198" text-anchor="middle" dominant-baseline="central" fill="#0C447C">2. Load and validate</text>
<text class="ts" x="175" y="218" text-anchor="middle" dominant-baseline="central">Check format, compute capacity</text>
<line x1="175" y1="232" x2="175" y2="262" class="arr-line"/>

<rect x="60" y="262" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="284" text-anchor="middle" dominant-baseline="central" fill="#0C447C">3. Secret message</text>
<text class="ts" x="175" y="304" text-anchor="middle" dominant-baseline="central">User types text input</text>
<line x1="175" y1="318" x2="175" y2="348" class="arr-line"/>

<rect x="60" y="348" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="370" text-anchor="middle" dominant-baseline="central" fill="#0C447C">4. Append terminator</text>
<text class="ts" x="175" y="390" text-anchor="middle" dominant-baseline="central">Add ###END### marker</text>
<line x1="175" y1="404" x2="175" y2="434" class="arr-line"/>

<rect x="60" y="434" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="456" text-anchor="middle" dominant-baseline="central" fill="#0C447C">5. LSB embedding</text>
<text class="ts" x="175" y="476" text-anchor="middle" dominant-baseline="central">Modify pixel LSBs bit-by-bit</text>
<line x1="175" y1="490" x2="175" y2="520" class="arr-line"/>

<rect x="60" y="520" width="230" height="56" rx="8" class="embed-box"/>
<text class="th" x="175" y="542" text-anchor="middle" dominant-baseline="central" fill="#0C447C">6. Save stego-image</text>
<text class="ts" x="175" y="562" text-anchor="middle" dominant-baseline="central">Write lossless PNG output</text>

<!-- EXTRACT steps -->
<rect x="390" y="90" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="112" text-anchor="middle" dominant-baseline="central" fill="#085041">1. Stego-image input</text>
<text class="ts" x="505" y="132" text-anchor="middle" dominant-baseline="central">Drag and drop PNG file</text>
<line x1="505" y1="146" x2="505" y2="176" class="arr-line"/>

<rect x="390" y="176" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="198" text-anchor="middle" dominant-baseline="central" fill="#085041">2. Load image</text>
<text class="ts" x="505" y="218" text-anchor="middle" dominant-baseline="central">Read pixel data into buffer</text>
<line x1="505" y1="232" x2="505" y2="262" class="arr-line"/>

<rect x="390" y="262" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="284" text-anchor="middle" dominant-baseline="central" fill="#085041">3. Read pixel LSBs</text>
<text class="ts" x="505" y="304" text-anchor="middle" dominant-baseline="central">Sequentially extract bits</text>
<line x1="505" y1="318" x2="505" y2="348" class="arr-line"/>

<rect x="390" y="348" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="370" text-anchor="middle" dominant-baseline="central" fill="#085041">4. Reconstruct bytes</text>
<text class="ts" x="505" y="390" text-anchor="middle" dominant-baseline="central">Assemble bits into byte array</text>
<line x1="505" y1="404" x2="505" y2="434" class="arr-line"/>

<rect x="390" y="434" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="456" text-anchor="middle" dominant-baseline="central" fill="#085041">5. Detect terminator</text>
<text class="ts" x="505" y="476" text-anchor="middle" dominant-baseline="central">Stop at ###END### marker</text>
<line x1="505" y1="490" x2="505" y2="520" class="arr-line"/>

<rect x="390" y="520" width="230" height="56" rx="8" class="extract-box"/>
<text class="th" x="505" y="542" text-anchor="middle" dominant-baseline="central" fill="#085041">6. Display message</text>
<text class="ts" x="505" y="562" text-anchor="middle" dominant-baseline="central">Show text + clipboard copy</text>

<!-- Shared LSB channel -->
<rect x="272" y="448" width="136" height="44" rx="8" class="shared-box"/>
<text class="th" x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="#444441">LSB channel</text>
<text class="ts" x="340" y="483" text-anchor="middle" dominant-baseline="central">1 bit per pixel</text>
<line x1="290" y1="462" x2="272" y2="462" class="arr-line"/>
<line x1="408" y1="462" x2="390" y2="462" class="arr-line"/>

<!-- Footer -->
<rect x="40" y="620" width="600" height="56" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="340" y="642" text-anchor="middle" dominant-baseline="central">Tools and technologies</text>
<text class="ts" x="340" y="662" text-anchor="middle" dominant-baseline="central">Java (JDK 11+)  ·  Java Swing  ·  javax.imageio.ImageIO  ·  PNG (lossless)  ·  Git / GitHub</text>

<!-- Legend -->
<rect x="40" y="700" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="62" y="712" dominant-baseline="central">Embedding process</text>
<rect x="220" y="700" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="242" y="712" dominant-baseline="central">Extraction process</text>
<rect x="400" y="700" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="422" y="712" dominant-baseline="central">Shared LSB channel</text>
</svg>