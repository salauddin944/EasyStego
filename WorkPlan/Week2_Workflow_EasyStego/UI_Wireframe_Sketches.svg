<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860">
<defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; fill: #555; }
    .muted { fill: #999; }
  </style>
</defs>
<rect width="680" height="860" fill="white"/>

<!-- ===== HIDE TAB ===== -->
<text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Hide message tab</text>

<!-- Window -->
<rect x="40" y="36" width="600" height="340" rx="8" fill="none" stroke="#999" stroke-width="1"/>
<!-- Title bar -->
<rect x="40" y="36" width="600" height="28" rx="8" fill="#F1EFE8" stroke="#999" stroke-width="1"/>
<rect x="40" y="52" width="600" height="12" fill="#F1EFE8"/>
<text class="ts" x="340" y="50" text-anchor="middle" dominant-baseline="central">EasyStego — Drag and Drop Steganography</text>
<circle cx="58" cy="50" r="5" fill="#ccc"/>
<circle cx="74" cy="50" r="5" fill="#ccc"/>
<circle cx="90" cy="50" r="5" fill="#ccc"/>

<!-- Tab bar -->
<rect x="40" y="64" width="600" height="28" fill="#eee" stroke="#ccc" stroke-width="0.5"/>
<rect x="44" y="64" width="148" height="28" rx="4" fill="white" stroke="#aaa" stroke-width="0.5"/>
<text class="ts" x="118" y="78" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">1. Hide message</text>
<text class="ts" x="272" y="78" text-anchor="middle" dominant-baseline="central" fill="#888">2. Reveal message</text>

<!-- Body -->
<rect x="40" y="92" width="600" height="284" fill="white"/>

<!-- Drop zone -->
<rect x="60" y="104" width="560" height="130" rx="6" fill="#f9f9f9" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="340" y="155" text-anchor="middle" dominant-baseline="central" fill="#888">Step 1: Drag and drop an image here (JPG / PNG)</text>
<text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central" fill="#bbb">Image preview appears here after drop</text>

<text class="ts" x="74" y="252" dominant-baseline="central" fill="#555">Step 2: Type your secret message:</text>
<rect x="60" y="264" width="560" height="60" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="0.5"/>
<text class="ts muted" x="74" y="294" dominant-baseline="central">Your message here...</text>
<text class="ts muted" x="74" y="336" dominant-baseline="central">Capacity: Waiting for image...</text>

<!-- Encrypt button -->
<rect x="60" y="348" width="560" height="44" rx="6" fill="#0078D7"/>
<text class="th" x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="white">Step 3: Encrypt and save image</text>

<!-- Annotation -->
<line x1="620" y1="168" x2="638" y2="168" stroke="#aaa" stroke-width="1" marker-end="url(#a2)"/>
<text class="ts" x="642" y="160" fill="#888">Dashed</text>
<text class="ts" x="642" y="176" fill="#888">drop zone</text>

<!-- ===== REVEAL TAB ===== -->
<text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">Reveal message tab</text>

<rect x="40" y="420" width="600" height="330" rx="8" fill="none" stroke="#999" stroke-width="1"/>
<rect x="40" y="420" width="600" height="28" rx="8" fill="#F1EFE8" stroke="#999" stroke-width="1"/>
<rect x="40" y="436" width="600" height="12" fill="#F1EFE8"/>
<text class="ts" x="340" y="434" text-anchor="middle" dominant-baseline="central">EasyStego — Drag and Drop Steganography</text>
<circle cx="58" cy="434" r="5" fill="#ccc"/>
<circle cx="74" cy="434" r="5" fill="#ccc"/>
<circle cx="90" cy="434" r="5" fill="#ccc"/>

<rect x="40" y="448" width="600" height="28" fill="#eee" stroke="#ccc" stroke-width="0.5"/>
<text class="ts" x="118" y="462" text-anchor="middle" dominant-baseline="central" fill="#888">1. Hide message</text>
<rect x="196" y="448" width="152" height="28" rx="4" fill="white" stroke="#aaa" stroke-width="0.5"/>
<text class="ts" x="272" y="462" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">2. Reveal message</text>

<rect x="40" y="476" width="600" height="274" fill="white"/>

<rect x="60" y="488" width="560" height="130" rx="6" fill="#f9f9f9" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="340" y="538" text-anchor="middle" dominant-baseline="central" fill="#888">Step 1: Drag and drop the secret image here</text>
<text class="ts" x="340" y="560" text-anchor="middle" dominant-baseline="central" fill="#bbb">Stego-image preview appears here after drop</text>

<text class="ts" x="74" y="634" dominant-baseline="central" fill="#555">Hidden message:</text>
<rect x="60" y="646" width="560" height="56" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
<text class="ts muted" x="74" y="673" dominant-baseline="central" font-family="Courier New, monospace">Decoded message appears here automatically...</text>

<!-- Copy button -->
<rect x="60" y="716" width="560" height="44" rx="6" fill="#2E8B57"/>
<text class="th" x="340" y="738" text-anchor="middle" dominant-baseline="central" fill="white">Copy text to clipboard</text>

<!-- LEGEND -->
<rect x="40" y="772" width="600" height="72" rx="6" fill="none" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="340" y="792" text-anchor="middle" dominant-baseline="central">Legend</text>
<rect x="60" y="806" width="20" height="14" rx="2" fill="#f9f9f9" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="86" y="813" dominant-baseline="central">Drag-and-drop zone</text>
<rect x="230" y="806" width="20" height="14" rx="2" fill="#0078D7"/>
<text class="ts" x="256" y="813" dominant-baseline="central">Primary action (embed)</text>
<rect x="420" y="806" width="20" height="14" rx="2" fill="#2E8B57"/>
<text class="ts" x="446" y="813" dominant-baseline="central">Secondary action (copy)</text>
</svg>